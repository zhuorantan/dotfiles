run-shell 'tmux set-environment -g TMUX_CONF_DIR "$(dirname "$(readlink "#{current_file}" || echo "#{current_file}")")"'

# -- general -------------------------------------------------------------------

set -s default-terminal "tmux-256color"           # 256 colours by default
set -sa terminal-overrides ",xterm-256color*:Tc"  # ...and truecolor where offered

set -s set-clipboard on   # let programs in a pane set the system clipboard
set -s focus-events on    # forward focus in/out so nvim can autoread

# A completed background agent turn sets this marker before ringing the normal
# tmux bell. Clear it as soon as its pane is viewed again.
set-hook -g pane-focus-in 'set-option -w @agent_notification 0'

# remap prefix from 'C-b' to 'C-a'; press it twice to send a literal C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g history-limit 100000   # boost history

# $TMUX_CONF_DIR is set by the run-shell at the top of this file, which has not
# finished when these lines are parsed — so keep the expansion inside run-shell,
# where the shell resolves it at key-press time instead.
# edit configuration
bind e run-shell 'tmux new-window -n tmux.conf "\${EDITOR:-nvim} $TMUX_CONF_DIR/tmux.conf; tmux source-file $TMUX_CONF_DIR/tmux.conf; tmux display \"tmux.conf sourced\""'

# reload configuration
bind r run-shell 'tmux source-file "$TMUX_CONF_DIR/tmux.conf" && tmux display "tmux.conf sourced"'

# enable vi mode for copy
setw -g mode-keys vi   # vi keys in copy mode

# emacs keys at the command prompt (prefix + :) are better than vi keys even for
# vim users — this undoes the vi default that $EDITOR=nvim would otherwise pick
set -g status-keys emacs

# on killing a session, switch to another one instead of detaching the client
set -g detach-on-destroy off

set -g mouse on
bind m run-shell '"$TMUX_CONF_DIR"/toggle_mouse.sh'   # toggle, to select text natively


# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set the terminal window title
set -g set-titles-string '#h ❐ #S ● #I #W'

set -g display-time 4000      # slightly longer status messages display time

setw -g aggressive-resize on  # useful with "grouped sessions" and multi-monitor


# -- navigation ----------------------------------------------------------------

# sessions
bind C-c new-session
bind Space display-popup -E -h 80% -w 60% -T ' sessions ' '"$TMUX_CONF_DIR"/project_picker.sh'
bind C-s run-shell 'sesh last'   # back to the previously used session

bind x kill-pane      # no "kill-pane 1? (y/n)" confirmation
bind X kill-session

# git worktrees, one window each. -d so the script sees the repo it was run from,
# whether that is the main checkout or another worktree.
bind C-w display-popup -E -h 80% -w 60% -T ' worktrees ' -d "#{pane_current_path}" 'wt picker'
bind g display-popup -E -h 90% -w 90% -T ' lazygit ' -d "#{pane_current_path}" 'lazygit'

# splits, always inheriting the current pane's directory. Capitals put the new
# pane before the current one instead of after.
bind s split-window -v -c "#{pane_current_path}"    # below
bind S split-window -vb -c "#{pane_current_path}"   # above
bind v split-window -h -c "#{pane_current_path}"    # right
bind V split-window -hb -c "#{pane_current_path}"   # left
unbind '"'   # replaced by s/S
unbind %     # replaced by v/V

# pane navigation, vi-style
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind > swap-pane -D   # swap with the next pane
bind < swap-pane -U   # swap with the previous pane

# pane resizing; -r so the key repeats without the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window navigation
unbind n   # replaced by C-l
unbind p   # replaced by C-h
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window   # back to the previously used window

# clear the screen *and* the scrollback, not just the screen. The sleep lets the
# shell finish redrawing its prompt before the history is dropped.
bind -n C-l send-keys C-l \; run-shell 'sleep 0.1' \; clear-history

bind -n S-Enter send-keys C-j   # newline without submitting, for REPLs


# -- yazi ----------------------------------------------------------------------

# yazi draws images with escape sequences tmux would otherwise swallow, and needs
# to know which terminal it is really talking to.
setw -g allow-passthrough all  # also pass notifications from inactive windows
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# y is the shell wrapper that cds to the directory yazi exited in
bind y new-window -c "#{pane_current_path}" 'zsh -i -c "y; zsh"'          # new window
bind Y respawn-pane -k -c "#{pane_current_path}" 'zsh -i -c "y; zsh"'    # this pane


# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode   # prefix + [ still works too

# vi selection keys: v starts a selection (tmux binds it to rectangle by default)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel   # leave outright, not just deselect

# copy without leaving copy mode, so several regions can be yanked in a row
bind -T copy-mode-vi y send -X copy-selection \; send -X clear-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection \; send -X clear-selection


# -- buffers -------------------------------------------------------------------

bind b list-buffers  # list paste buffers
bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from


# -- theme ---------------------------------------------------------------------

# catppuccin is cloned by `make tmux`, not a plugin manager
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"

set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_text_color},bg=default]#[none]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_number_color},bg=default]#[none]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_text_color},bg=default]#[none]"
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_number_color},bg=default]#[none]"

set -g @catppuccin_status_module_text_bg "#{@thm_mantle}"
set -g @catppuccin_window_number_position "right"

# Shared by window tabs and the cross-session status pill.
set -g @agent_notification_icon '󰚩'
set -g @agent_working_icon '▶'
set -g @bell_notification_icon '󰂞'

# A completed-turn marker takes precedence over the working indicator. Agent
# TUIs prefix their pane title with a Braille spinner while a turn is active.
# Render the current frame for matching panes; the stable working icon remains
# available to the slower cross-session status pill.
set -g @agent_working_animation '#{P:#{?#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ,#{pane_title}},#{=1:pane_title},}}'
set -g @catppuccin_window_text "#W#{?#{==:#{@agent_notification},1}, #{E:@agent_notification_icon},#{?#{m/r:(^|[|])[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ,#{P:#{pane_title}|}}, #{E:@agent_working_animation},}}#{?window_zoomed_flag, 🔍,}"
set -g @catppuccin_window_current_text "#W#{?#{==:#{@agent_notification},1}, #{E:@agent_notification_icon},#{?#{m/r:(^|[|])[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ,#{P:#{pane_title}|}}, #{E:@agent_working_animation},}}#{?window_zoomed_flag, 🔍,}"

set -g @catppuccin_date_time_text " %b %d %R"
set -g @catppuccin_host_text " #h"

run-shell ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-interval 5      # redraw status line every 5 seconds
set -g status-left-length 100
set -g status-right-length 100

# session block turns red while the prefix is held
set -g @_session_status_fg "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"

# The helper substitutes the alert label (%s), icon (%i), accent (%a), and the
# background following its end cap (%b).
set -gF @_status_pill_format '#[fg=#{@thm_fg},bg=#{E:@catppuccin_status_module_text_bg}] %s #[fg=%a]█#[fg=#{@thm_crust},bg=%a]%i #[fg=%a,bg=%b]'
set -gF @agent_notification_status_accent '#{@thm_green}'
set -gF @agent_working_status_accent '#{@thm_sky}'
set -gF @bell_notification_status_accent '#{@thm_yellow}'

# Keep the complete prefix-sensitive session pill synchronous. The asynchronous
# helper caches whether its connected alert pill follows, so the cap background
# and the live prefix accent are both rendered by tmux in the same update.
set -g status-left "#[fg=#{@thm_fg},bg=#{E:@catppuccin_status_module_text_bg}] #S #[fg=#{E:@_session_status_fg}]█#[fg=#{@thm_crust},bg=#{E:@_session_status_fg}] #[fg=#{E:@_session_status_fg},bg=#{?#{==:#{@_status_has_notification},1},#{E:@catppuccin_status_module_text_bg},default}]"
set -ag status-left '#("$TMUX_CONF_DIR"/status_notifications.sh "#{session_name}")#[default] '
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# A local prompt already identifies the machine well enough. Keep the host pill
# as a remote-session cue, including when an existing tmux session is attached.
set -ag status-right "#{?#{SSH_CONNECTION},#{E:@catppuccin_status_host},}"
